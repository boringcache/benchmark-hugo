name: "Hugo Docker Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image for canary runs."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      cli_platform:
        description: "Optional BoringCache CLI platform."
        required: false
        type: string
        default: linux-musl-amd64
      benchmark_id_suffix:
        description: "Optional suffix for an isolated comparison run."
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths: [".gitmodules", "upstream"]
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".gitmodules"
      - ".github/workflows/hugo-benchmark.yml"
      - ".github/workflows/hugo-fresh-benchmark.yml"
      - ".github/workflows/reusable-hugo-docker-benchmark.yml"
      - "scripts/prepare-source.sh"
      - "scripts/scope-boringcache-run.sh"
      - "upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GHA
            strategy: actions-cache
          - label: BoringCache
            strategy: boringcache
    uses: ./.github/workflows/reusable-hugo-docker-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: rolling
      benchmark_id: ${{ format('hugo{0}', inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
      cli_platform: ${{ inputs.cli_platform }}
      buildkit_image: ${{ inputs.buildkit_image }}
    secrets: inherit
