name: "Hugo Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      buildkit_image: {description: "Optional managed BoringCache BuildKit image.", required: false, type: string, default: ""}
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      cli_platform: {description: "Optional BoringCache CLI platform.", required: false, type: string, default: linux-amd64}
      benchmark_id_suffix: {description: "Optional suffix for an isolated comparison run.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  schedule: [{cron: "0 3 * * 1"}]
  pull_request:
    paths: [".boringcache.toml", ".gitmodules", ".github/actions/hugo-docker-benchmark/**", ".github/workflows/hugo-benchmark.yml", ".github/workflows/hugo-fresh-benchmark.yml", "scripts/**", "upstream"]
concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: read}
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
jobs:
  cold:
    name: ${{ matrix.provider }} Hugo Docker cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy: &provider_strategy
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache}
          - {provider: BoringCache, strategy: boringcache}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/hugo-docker-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: fresh, phase: publish, benchmark_id: "${{ format('hugo{0}', inputs.benchmark_id_suffix) }}", cli_version: "${{ inputs.cli_version }}", cli_platform: "${{ inputs.cli_platform }}", buildkit_image: "${{ inputs.buildkit_image }}"}
  warm:
    name: ${{ matrix.provider }} Hugo Docker warm
    needs: cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy: *provider_strategy
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/hugo-docker-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: fresh, phase: warm, benchmark_id: "${{ format('hugo{0}', inputs.benchmark_id_suffix) }}", cli_version: "${{ inputs.cli_version }}", cli_platform: "${{ inputs.cli_platform }}", buildkit_image: "${{ inputs.buildkit_image }}"}
