name: "Hugo Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image for canary runs."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      cli_platform:
        description: "Optional BoringCache CLI platform."
        required: false
        type: string
        default: linux-amd64
      benchmark_id_suffix:
        description: "Optional suffix for an isolated comparison run."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GHA
            strategy: actions-cache
          - label: BoringCache
            strategy: boringcache
    uses: ./.github/workflows/reusable-hugo-docker-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: fresh
      benchmark_id: ${{ format('hugo{0}', inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
      cli_platform: ${{ inputs.cli_platform }}
      buildkit_image: ${{ inputs.buildkit_image }}
    secrets: inherit
